# Thresholds of the Critic (app/services/critic.py), read with Python's tomllib.
# Version v1-critic-study: tuned by the critic study (task 16) on the tuning seeds [0, 1, 2, 3, 4];
# precision and recall on the reporting seeds [100, 101, 102, 103, 104] are in results/studies/critic_study_summary.csv.
# Gaps, skills, gains and spreads are in units of the diagnostic metric (F1, accuracy, ROC-AUC or R2).
version = "v1-critic-study"

[overfitting]
# gap = mean over the folds of (training score - validation score)
high_gap = 0.2
moderate_gap = 0.11

[underfitting]
# Only when gap < max_gap. skill = (validation - baseline) / (1 - baseline), means over the folds
high_skill = 0.25
max_gap = 0.03
moderate_skill = 0.5

[budget_limited]
# Improvement of the search's best score in the last quarter of the search time (bounded metrics only)
high_gain = 0.02
moderate_gain = 0.005

[wasted_budget]
# Share of the search time after the best configuration was found
high_share = 0.75
moderate_share = 0.5

[class_imbalance]
# ratio = largest / smallest class; recall = mean validation recall of the smallest class
high_ratio = 9.0
high_recall = 0.3
min_ratio_for_recall = 1.5
moderate_ratio = 3.0
moderate_recall = 0.5

[missing_values]
# Share of empty cells of a used column in the Training_Part
high_share = 0.7
moderate_share = 0.3

[high_cardinality]
# distinct = values of a used text column (more than this is moderate); unseen = mean share of validation rows with a value not seen in the fold's training rows
high_unseen = 0.6
moderate_distinct = 50
moderate_unseen = 0.3

[constant_column]
# A used column with one value, or with the same value in at least this share of rows (low)
near_constant_share = 0.98

[redundant_features]
# Absolute Pearson correlation of two used numeric columns in the Training_Part
high_correlation = 0.99
moderate_correlation = 0.95

[unreliable_validation]
# Standard deviation of the validation score over the folds
high_std = 0.08
moderate_std = 0.05

[weak_model_families]
# A family at least min_gap behind the best family that used at least min_time_share of the search time
min_gap = 0.1
min_time_share = 0.05
